[package]
name = "inkbench-kernels"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "InkBench CPU/memory kernels, built natively and to wasm32 for the host ratio"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "inkbench-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
