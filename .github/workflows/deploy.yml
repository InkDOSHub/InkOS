name: Unpack Bundle, Build and Deploy InkOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: inkos-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract bundle zip into repository folders
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ "${#zips[@]}" -gt 0 ]; then
            for z in "${zips[@]}"; do
              echo "Extracting $z..."
              unzip -o "$z" -d .
              rm -f "$z"
            done
          fi

      - name: Commit extracted files back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: unpack InkOS bundle into repository layout"
            git push origin HEAD:main
          fi

      - name: Set up Node.js (for optional wasm-opt / binaryen fallback)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run InkOS build script
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Verify COOP/COEP headers and output bundle
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/pkg/inkos.js
          test -f dist/pkg/inkos_bg.wasm
          grep -q '^  Cross-Origin-Opener-Policy: same-origin$' dist/_headers
          grep -q '^  Cross-Origin-Embedder-Policy: require-corp$' dist/_headers

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
