name: Build and Deploy InkOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: inkos-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for optional wasm-opt / binaryen fallback)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run InkOS build script
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Verify COOP/COEP headers and output bundle
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/pkg/inkos.js
          test -f dist/pkg/inkos_bg.wasm
          grep -q '^  Cross-Origin-Opener-Policy: same-origin$' dist/_headers
          grep -q '^  Cross-Origin-Embedder-Policy: require-corp$' dist/_headers

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
