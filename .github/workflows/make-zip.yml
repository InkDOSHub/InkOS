name: Make InkOS Zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build inkos-bundle.zip from gemini-code-1795097281585.txt
        run: |
          test -f gemini-code-1795097281585.txt
          python3 - <<'EOF'
          from pathlib import Path
          import re, zipfile

          text = Path("gemini-code-1795097281585.txt").read_text(encoding="utf-8")
          parts = re.split(r"^=== FILE: (.+?) ===\r?\n", text, flags=re.MULTILINE)

          count = 0
          with zipfile.ZipFile("inkos-bundle.zip", "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for i in range(1, len(parts), 2):
                  rel_path = parts[i].strip().lstrip("./")
                  content = parts[i + 1]
                  if content.endswith("\n"):
                      content = content[:-1]
                  zf.writestr(rel_path, content + ("\n" if content else ""))
                  count += 1

          print(f"Packed {count} files into inkos-bundle.zip")
          EOF
          rm -f gemini-code-1795097281585.txt
          ls -lh inkos-bundle.zip

      - name: Commit zip to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inkos-bundle.zip
          git rm -f --ignore-unmatch gemini-code-1795097281585.txt
          git commit -m "chore: generate inkos-bundle.zip" || true
          git push origin HEAD:main
