[package]
name = "inkos"
version = "0.1.0"
edition = "2021"
description = "InkSoC kernel for InkOS, a web operating system on WebAssembly"
repository = "https://github.com/InkDOSHub/InkOS"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-encoder = "0.221"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Blob",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
]

# wasm-opt runs in scripts/build.sh with an explicit, engine-safe feature set.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
