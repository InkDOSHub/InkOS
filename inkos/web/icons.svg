<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Launcher / Applications (COSMIC grid) -->
  <symbol id="i-apps" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="4.5" height="4.5" rx="1.2" fill="currentColor" fill-opacity=".25" />
    <rect x="9.75" y="3" width="4.5" height="4.5" rx="1.2" />
    <rect x="16.5" y="3" width="4.5" height="4.5" rx="1.2" />
    <rect x="3" y="9.75" width="4.5" height="4.5" rx="1.2" />
    <rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1.2" fill="currentColor" fill-opacity=".25" />
    <rect x="16.5" y="9.75" width="4.5" height="4.5" rx="1.2" />
    <rect x="3" y="16.5" width="4.5" height="4.5" rx="1.2" />
    <rect x="9.75" y="16.5" width="4.5" height="4.5" rx="1.2" />
    <rect x="16.5" y="16.5" width="4.5" height="4.5" rx="1.2" fill="currentColor" fill-opacity=".25" />
  </symbol>

  <!-- Desktop / Workspaces -->
  <symbol id="i-desktop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="14" rx="2.5" />
    <path d="M8 20h8M12 18v2" />
  </symbol>

  <!-- Finder / Files (COSMIC Files style) -->
  <symbol id="i-finder" viewBox="0 0 24 24" fill="none">
    <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4.2l2 2H18.5A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Z" fill="#38bdf8" fill-opacity=".25" stroke="#38bdf8" stroke-width="1.7" />
    <path d="M3 9.5h18" stroke="#38bdf8" stroke-width="1.5" />
  </symbol>

  <!-- Browser -->
  <symbol id="i-browser" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" fill="#fb923c" fill-opacity=".16" />
    <ellipse cx="12" cy="12" rx="4" ry="9" />
    <path d="M3.5 9h17M3.5 15h17" />
  </symbol>

  <!-- Terminal (COSMIC Terminal) -->
  <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="#a6e3a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2.8" fill="#a6e3a1" fill-opacity=".14" />
    <path d="M7.5 9.5 10.5 12l-3 2.5M12.5 15h4" />
  </symbol>

  <!-- CMD / EXE Installer -->
  <symbol id="i-cmd" viewBox="0 0 24 24" fill="none" stroke="#e5a373" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2.8" fill="#e5a373" fill-opacity=".16" />
    <path d="M3 8.5h18M7 6.2h.01M9.5 6.2h.01M12 6.2h.01" />
    <path d="M8 12.5h8M8 15.5h5" />
  </symbol>

  <!-- Window generic -->
  <symbol id="i-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2.5" />
    <path d="M3 8.5h18" />
  </symbol>
</svg>
