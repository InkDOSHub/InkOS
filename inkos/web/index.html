<!doctype html>
<html lang="pt-PT" data-theme="mocha">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>InkOS — COSMIC Desktop</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./theme/catppuccin.css">
</head>
<body>
  <header class="topbar" role="banner">
    <div class="topbar-left">
      <button id="ws-toggle" class="top-pill" type="button">Workspaces</button>
      <button id="top-apps-btn" class="top-pill" type="button">Applications</button>
      <strong style="margin-left:4px;font-size:13px;">InkOS</strong>
    </div>
    <div class="topbar-center">
      <span id="clock" style="font-weight:600;">--:--</span>
    </div>
    <div class="topbar-right">
      <span id="isolation-badge" class="badge-iso"></span>
      <button id="keys-toggle" class="top-pill" type="button" title="Teclas modificadoras">Keys</button>
      <button id="theme-toggle" class="top-pill" type="button" aria-label="Alternar tema claro e escuro">◐</button>
    </div>
  </header>

  <aside id="workspace-rail" class="workspace-rail" aria-label="Workspaces">
    <button class="ws-card active" data-ws="1" type="button">
      <strong>Workspace 1</strong>
      <span class="ws-count" id="ws-count-1">0 janelas</span>
    </button>
    <button class="ws-card" data-ws="2" type="button">
      <strong>Workspace 2</strong>
      <span class="ws-count" id="ws-count-2">0 janelas</span>
    </button>
    <button class="ws-card" data-ws="3" type="button">
      <strong>Workspace 3</strong>
      <span class="ws-count" id="ws-count-3">0 janelas</span>
    </button>
  </aside>

  <main id="desktop" class="desktop" aria-label="InkOS desktop">
    <canvas id="framebuffer" aria-label="Desktop framebuffer"></canvas>
    <section class="launcher-overlay" id="launcher-window" hidden aria-label="Applications Launcher">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <strong>Applications — InkDOS Hub &amp; Nativos</strong>
        <button id="launcher-close" class="mac-light close" type="button" aria-label="Fechar" style="color:rgba(0,0,0,.72);">×</button>
      </div>
      <input id="launcher-search" class="launcher-search" type="search" placeholder="Type to search apps..." autocomplete="off">
      <div id="app-grid"></div>
    </section>
  </main>

  <aside id="modifier-bar" class="modifier-bar" aria-label="Teclas modificadoras">
    <button data-key="Escape" type="button">Esc</button>
    <button data-key="Tab" type="button">Tab</button>
    <button data-key="Control" type="button">Ctrl</button>
    <button data-key="Alt" type="button">Opt</button>
    <button data-key="Meta" type="button">Cmd</button>
    <button data-key="ArrowLeft" type="button">←</button>
    <button data-key="ArrowDown" type="button">↓</button>
    <button data-key="ArrowUp" type="button">↑</button>
    <button data-key="ArrowRight" type="button">→</button>
  </aside>

  <div class="dock-wrap">
    <nav id="dock" class="dock" aria-label="Dock de aplicativos"></nav>
  </div>

  <script type="module">
    const desktopEl = document.querySelector("#desktop");
    const dockEl = document.querySelector("#dock");
    const launcherWin = document.querySelector("#launcher-window");
    const launcherGrid = document.querySelector("#app-grid");
    const launcherSearch = document.querySelector("#launcher-search");
    const badge = document.querySelector("#isolation-badge");
    badge.textContent = window.crossOriginIsolated ? "SAB • JIT Ativo" : "Modo Compatibilidade";

    const svgIcon = (id, size = 20) =>
      `<svg width="${size}" height="${size}" aria-hidden="true"><use href="./icons.svg#${id}"></use></svg>`;

    const updateClock = () => {
      document.querySelector("#clock").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date());
    };
    updateClock();
    setInterval(updateClock, 15000);

    const wsRail = document.querySelector("#workspace-rail");
    document.querySelector("#ws-toggle").addEventListener("click", () => {
      wsRail.classList.toggle("open");
    });

    const modBar = document.querySelector("#modifier-bar");
    document.querySelector("#keys-toggle").addEventListener("click", () => {
      modBar.classList.toggle("open");
    });
    modBar.querySelectorAll("button[data-key]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const active = document.activeElement;
        if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) {
          active.dispatchEvent(new KeyboardEvent("keydown", { key: btn.dataset.key, bubbles: true }));
        }
      });
    });

    const [{ WindowManager }, appload] = await Promise.all([
      import("./js/wm.js"),
      import("./js/appload.js"),
    ]);

    let vfs = null;
    try {
      const vfsMod = await import("./js/vfs.js");
      vfs = vfsMod.vfs;
      await vfs.init();
    } catch (e) {
      console.warn("[InkOS] vfs.js ausente ou falhou:", e);
    }

    let settingsMod = null;
    try {
      settingsMod = await import("./js/apps/settings.js");
      settingsMod.applyPrefs();
    } catch (e) {
      console.warn("[InkOS] settings.js ausente ou falhou:", e);
    }

    let wm;
    const renderDock = (wins = []) => {
      dockEl.innerHTML = "";
      const pinned = [
        { id: "launcher", label: "Apps", iconId: "i-apps", action: () => toggleLauncher() },
        { id: "finder", label: "Finder", iconId: "i-finder", action: () => appload.openApp("finder", desktopEl) },
        { id: "browser", label: "Browser", iconId: "i-browser", action: () => appload.openApp("browser", desktopEl) },
        { id: "shell", label: "Terminal", iconId: "i-terminal", action: () => appload.openApp("shell", desktopEl) },
        { id: "cmdexe", label: "CMD/EXE", iconId: "i-cmd", action: () => appload.openApp("cmdexe", desktopEl) },
        { id: "monitor", label: "Monitor", iconId: "i-monitor", action: () => appload.openApp("monitor", desktopEl) },
        { id: "settings", label: "Ajustes", iconId: "i-settings", action: () => appload.openApp("settings", desktopEl) },
      ];
      for (const p of pinned) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "dock-item";
        const runningMatch = wins.find((w) => w.id === `native-${p.id}` || w.id === `hub-${p.id}`);
        if (runningMatch) b.classList.add("running");
        if (runningMatch?.focused) b.classList.add("focused");
        b.innerHTML = `${svgIcon(p.iconId, 20)}<span>${p.label}</span>`;
        b.onclick = () => {
          if (runningMatch && runningMatch.focused && !runningMatch.minimized) {
            wm.minimize(runningMatch.id);
          } else {
            p.action();
          }
        };
        dockEl.append(b);
      }

      const openWins = wins.filter((w) => !/^native-(finder|browser|shell|cmdexe|monitor|settings)$/.test(w.id));
      if (openWins.length > 0) {
        const sep = document.createElement("div");
        sep.className = "dock-sep";
        dockEl.append(sep);
        for (const w of openWins) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = `dock-item running ${w.focused ? "focused" : ""}`;
          b.title = w.title;
          const shortTitle = w.title.length > 12 ? w.title.slice(0, 11) + "…" : w.title;
          b.innerHTML = `${svgIcon("i-window", 18)}<span>${shortTitle}</span>`;
          b.onclick = () => {
            if (w.focused && !w.minimized) wm.minimize(w.id);
            else wm.focus(w.id);
          };
          dockEl.append(b);
        }
      }

      for (let i = 1; i <= 3; i++) {
        const el = document.querySelector(`#ws-count-${i}`);
        if (el) {
          const c = wins.filter((x) => x.workspace === i).length;
          el.textContent = `${c} ${c === 1 ? "janela" : "janelas"}`;
        }
      }
    };

    wm = new WindowManager(desktopEl, { onChange: renderDock });
    appload.bindWindowManager(wm);
    renderDock([]);

    wsRail.querySelectorAll(".ws-card").forEach((card) => {
      card.addEventListener("click", () => {
        const n = Number(card.dataset.ws || 1);
        wm.setWorkspace(n);
        wsRail.querySelectorAll(".ws-card").forEach((c) => c.classList.toggle("active", c === card));
      });
    });

    const lazyNative = (path, exportName, fallbackMsg) => async (el, ctx) => {
      try {
        const mod = await import(path);
        return await mod[exportName](el, {
          ...ctx,
          vfs,
          wm,
          closeApp: (id) => appload.closeApp(id),
          syncTheme: appload.syncTheme,
        });
      } catch (e) {
        el.innerHTML = `<div style="padding:16px;font-size:13px;line-height:1.5;">
          <strong>Módulo pendente:</strong> <code>${path}</code><br>
          <span style="color:var(--muted);">${fallbackMsg} (${e.message})</span>
        </div>`;
      }
    };

    appload.registerNativeApp("finder", {
      title: "Finder — Memória Interna InkOS",
      width: 820,
      height: 520,
      mount: lazyNative("./js/apps/finder.js", "mountFinder", "Crie inkos/web/js/apps/finder.js no repositório."),
    });
    appload.registerNativeApp("browser", {
      title: "InkBrowser",
      width: 900,
      height: 600,
      mount: lazyNative("./js/apps/browser.js", "mountBrowser", "Crie inkos/web/js/apps/browser.js no repositório."),
    });
    appload.registerNativeApp("shell", {
      title: "Alpine Linux — InkShell",
      width: 780,
      height: 480,
      mount: lazyNative("./js/apps/shell.js", "mountShell", "Crie inkos/web/js/apps/shell.js no repositório."),
    });
    appload.registerNativeApp("cmdexe", {
      title: "CMD & Instalador .EXE",
      width: 800,
      height: 520,
      mount: lazyNative("./js/apps/cmd-exe.js", "mountCmdExe", "Crie inkos/web/js/apps/cmd-exe.js no repositório."),
    });
    appload.registerNativeApp("monitor", {
      title: "Monitor de Sistema",
      width: 680,
      height: 500,
      mount: lazyNative("./js/apps/monitor.js", "mountMonitor", "Crie inkos/web/js/apps/monitor.js no repositório."),
    });
    appload.registerNativeApp("settings", {
      title: "Configurações & Planos de Fundo",
      width: 740,
      height: 500,
      mount: lazyNative("./js/apps/settings.js", "mountSettings", "Crie inkos/web/js/apps/settings.js no repositório."),
    });

    (async () => {
      const diag = {
        isolated: Boolean(window.crossOriginIsolated),
        wasmLoaded: false,
        wasiCompiled: false,
        workerReady: false,
        lastError: null,
      };
      window.inkOS = {
        diag,
        vfs,
        openApp: appload.openApp,
        closeApp: appload.closeApp,
      };

      if (!window.crossOriginIsolated) {
        diag.lastError = "crossOriginIsolated=false";
        return;
      }

      let mod = null;
      try {
        mod = await import("./pkg/inkos.js");
        if (typeof mod.default === "function") {
          await mod.default();
        }
        diag.wasmLoaded = true;
      } catch (e) {
        diag.lastError = `wasm init: ${e?.message || e}`;
        console.warn("[InkOS wasm init]", e);
        return;
      }

      const initialPages = 256;
      const maxPages = 16384;
      let memory = null;
      try {
        memory = new WebAssembly.Memory({
          initial: initialPages,
          maximum: maxPages,
          shared: true,
        });
        window.inkOS.memory = memory;
      } catch (e) {
        diag.lastError = `memory: ${e?.message || e}`;
        console.warn("[InkOS memory]", e);
        return;
      }

      let soc = null;
      if (typeof mod.InkSoC === "function") {
        try {
          soc = new mod.InkSoC(initialPages);
          soc.bind_shared_memory?.(memory.buffer);
          window.inkOS.soc = soc;
        } catch (e) {
          diag.lastError = `InkSoC ctor: ${e?.message || e}`;
          console.warn("[InkSoC ctor]", e);
        }
      }

      if (soc && typeof soc.emit_wasi_module === "function") {
        try {
          const wasiMod = soc.emit_wasi_module();
          if (wasiMod) {
            await WebAssembly.compile(wasiMod);
            diag.wasiCompiled = true;
          }
        } catch (e) {
          diag.lastError = `wasi compile: ${e?.message || e}`;
          console.warn("[InkSoC wasi compile]", e);
        }
      }

      try {
        const control = new SharedArrayBuffer(4096);
        const worker = new Worker("./js/swap.worker.js", { type: "module" });
        worker.postMessage({
          type: "init",
          pageSize: 65536,
          memory,
          control,
        });
        window.inkOS.control = control;
        window.inkOS.worker = worker;
        diag.workerReady = true;
      } catch (e) {
        diag.lastError = `swap worker: ${e?.message || e}`;
        console.warn("[InkOS swap worker]", e);
      }
    })();

    function toggleLauncher(force) {
      const next = typeof force === "boolean" ? force : !launcherWin.hidden;
      launcherWin.hidden = next;
      if (!launcherWin.hidden) {
        appload.mountLauncher(launcherGrid, desktopEl, { filterText: launcherSearch.value }).catch(console.error);
        launcherSearch.focus();
      }
    }

    launcherSearch.addEventListener("input", () => {
      appload.mountLauncher(launcherGrid, desktopEl, { filterText: launcherSearch.value }).catch(console.error);
    });
    launcherGrid.addEventListener("click", (e) => {
      if (e.target.closest("button")) toggleLauncher(true);
    });

    document.querySelector("#top-apps-btn").addEventListener("click", () => toggleLauncher());
    document.querySelector("#launcher-close").addEventListener("click", () => toggleLauncher(true));

    document.querySelector("#theme-toggle").addEventListener("click", () => {
      const cur = document.documentElement.dataset.theme;
      const next = cur === "latte" ? "mocha" : "latte";
      document.documentElement.dataset.theme = next;
      if (settingsMod?.savePrefs) settingsMod.savePrefs({ theme: next });
      appload.syncTheme();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(console.error);
    }
  </script>
</body>
</html>
