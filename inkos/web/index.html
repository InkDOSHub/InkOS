<!doctype html>
<html lang="pt-PT" data-theme="mocha">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InkOS">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>InkOS Desktop</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./theme/catppuccin.css">
</head>
<body>
  <header class="topbar" role="banner">
    <div class="topbar-left">
      <button id="inkos-menu" class="top-pill inkos-menu-btn" type="button" aria-haspopup="menu" aria-label="Menu InkOS">InkOS</button>
      <span id="active-app" class="active-app"></span>
    </div>
    <div class="topbar-right">
      <span id="isolation-badge" class="badge-iso"></span>
      <span id="clock" style="font-weight:600;">--:--</span>
      <!-- Hidden: driven from the InkOS menu -->
      <button id="keys-toggle" type="button" hidden>Keys</button>
      <button id="theme-toggle" type="button" hidden>Tema</button>
    </div>
  </header>

  <aside id="workspace-rail" class="workspace-rail" aria-label="Workspaces">
    <button class="ws-card active" data-ws="1" type="button">
      <strong>Workspace 1</strong>
      <span class="ws-count" id="ws-count-1">0 janelas</span>
    </button>
    <button class="ws-card" data-ws="2" type="button">
      <strong>Workspace 2</strong>
      <span class="ws-count" id="ws-count-2">0 janelas</span>
    </button>
    <button class="ws-card" data-ws="3" type="button">
      <strong>Workspace 3</strong>
      <span class="ws-count" id="ws-count-3">0 janelas</span>
    </button>
  </aside>

  <main id="desktop" class="desktop" aria-label="InkOS desktop">
    <canvas id="framebuffer" aria-label="Desktop framebuffer"></canvas>
    <section class="launcher-overlay" id="launcher-window" hidden aria-label="Applications Launcher">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <strong>Aplicativos</strong>
        <button id="launcher-close" class="mac-light close" type="button" aria-label="Fechar" style="color:rgba(0,0,0,.72);">×</button>
      </div>
      <input id="launcher-search" class="launcher-search" type="search" placeholder="Buscar apps e programas" autocomplete="off">
      <div id="app-grid"></div>
    </section>
  </main>

  <aside id="modifier-bar" class="modifier-bar" aria-label="Teclas modificadoras">
    <button data-key="Escape" type="button">Esc</button>
    <button data-key="Tab" type="button">Tab</button>
    <button data-key="Control" type="button">Ctrl</button>
    <button data-key="Alt" type="button">Opt</button>
    <button data-key="Meta" type="button">Cmd</button>
    <button data-key="ArrowLeft" type="button">←</button>
    <button data-key="ArrowDown" type="button">↓</button>
    <button data-key="ArrowUp" type="button">↑</button>
    <button data-key="ArrowRight" type="button">→</button>
  </aside>

  <div class="dock-wrap">
    <nav id="dock" class="dock" aria-label="Dock de aplicativos"></nav>
  </div>

  <script type="module">
    const desktopEl = document.querySelector("#desktop");
    const dockEl = document.querySelector("#dock");
    const launcherWin = document.querySelector("#launcher-window");
    const launcherGrid = document.querySelector("#app-grid");
    const launcherSearch = document.querySelector("#launcher-search");
    const badge = document.querySelector("#isolation-badge");
    badge.textContent = window.crossOriginIsolated ? "SAB • JIT Ativo" : "Modo Compatibilidade";

    const svgIcon = (id, size = 20) =>
      `<svg width="${size}" height="${size}" aria-hidden="true"><use href="./icons.svg#${id}"></use></svg>`;

    const updateClock = () => {
      document.querySelector("#clock").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date());
    };
    updateClock();
    setInterval(updateClock, 15000);

    const wsRail = document.querySelector("#workspace-rail");

    const [{ WindowManager }, appload] = await Promise.all([
      import("./js/wm.js"),
      import("./js/appload.js"),
    ]);

    let vfs = null;
    try {
      const vfsMod = await import("./js/vfs.js");
      vfs = vfsMod.vfs;
      await vfs.init();
    } catch (e) {
      console.warn("[InkOS] vfs.js ausente ou falhou:", e);
    }

    let settingsMod = null;
    try {
      settingsMod = await import("./js/apps/settings.js");
      settingsMod.applyPrefs();
    } catch (e) {
      console.warn("[InkOS] settings.js ausente ou falhou:", e);
    }

    let wm;
    // macOS dock magnification: with a mouse, icons near the pointer grow (cosine falloff over
    // ~2.5 icons), pushing their neighbours aside; touch screens keep the plain dock.
    let dockMagnify = null;
    if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
      const BASE = 48, MAX = 1.85, RANGE = 150;
      let mx = null, raf = 0;
      dockMagnify = () => {
        raf = 0;
        for (const it of dockEl.querySelectorAll(".dock-item")) {
          let k = 1;
          if (mx !== null) {
            const r = it.getBoundingClientRect();
            const d = Math.abs(mx - (r.left + r.width / 2));
            if (d < RANGE) k = 1 + (MAX - 1) * Math.cos((d / RANGE) * (Math.PI / 2));
          }
          it.style.setProperty("--mag", k.toFixed(3));
        }
      };
      document.documentElement.classList.add("dock-magnify");
      dockEl.addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;
        mx = e.clientX;
        raf ||= requestAnimationFrame(dockMagnify);
      });
      dockEl.addEventListener("pointerleave", () => { mx = null; raf ||= requestAnimationFrame(dockMagnify); });
      void BASE;
    }
    const renderDock = (wins = []) => {
      dockEl.innerHTML = "";
      const pinned = [
        { id: "launcher", label: "Apps", iconId: "i-apps", action: () => toggleLauncher() },
        { id: "finder", label: "Finder", iconId: "i-finder", action: () => appload.openApp("finder", desktopEl) },
        { id: "browser", label: "Browser", iconId: "i-browser", action: () => appload.openApp("browser", desktopEl) },
        { id: "shell", label: "Terminal", iconId: "i-terminal", action: () => appload.openApp("shell", desktopEl) },
        { id: "cmdexe", label: "CMD/EXE", iconId: "i-cmd", action: () => appload.openApp("cmdexe", desktopEl) },
        { id: "monitor", label: "Monitor", iconId: "i-monitor", action: () => appload.openApp("monitor", desktopEl) },
        { id: "settings", label: "Ajustes", iconId: "i-settings", action: () => appload.openApp("settings", desktopEl) },
      ];
      for (const p of pinned) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "dock-item";
        const runningMatch = wins.find((w) => w.id === `native-${p.id}` || w.id === `hub-${p.id}` || w.id === `frame-${p.id}`);
        if (runningMatch) b.classList.add("running");
        if (runningMatch?.focused) b.classList.add("focused");
        if (runningMatch) b.dataset.winId = runningMatch.id;
        b.dataset.label = p.label;
        b.setAttribute("aria-label", p.label);
        b.innerHTML = `${svgIcon(p.iconId, 26)}<span>${p.label}</span>`;
        b.onclick = () => {
          if (runningMatch && runningMatch.focused && !runningMatch.minimized) {
            wm.minimize(runningMatch.id);
          } else {
            // macOS: an app that starts bounces once
            if (!runningMatch) { b.classList.add("bounce"); setTimeout(() => b.classList.remove("bounce"), 700); }
            p.action();
          }
        };
        dockEl.append(b);
      }

      const openWins = wins.filter((w) => !/^(native-(finder|browser|monitor|settings)|frame-(shell|cmdexe))$/.test(w.id));
      if (openWins.length > 0) {
        const sep = document.createElement("div");
        sep.className = "dock-sep";
        dockEl.append(sep);
        for (const w of openWins) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = `dock-item running ${w.focused ? "focused" : ""}`;
          b.dataset.winId = w.id;
          b.dataset.label = w.title;
          b.setAttribute("aria-label", w.title);
          const shortTitle = w.title.length > 12 ? w.title.slice(0, 11) + "…" : w.title;
          const icon = /^native-vfs-shell$/.test(w.id) ? "i-terminal" : /^frame-cmdexe-/.test(w.id) ? "i-exe" : "i-window";
          b.innerHTML = `${svgIcon(icon, 26)}<span>${shortTitle}</span>`;
          b.onclick = () => {
            if (w.focused && !w.minimized) wm.minimize(w.id);
            else wm.focus(w.id);
          };
          dockEl.append(b);
        }
      }

      dockMagnify?.();
      const active = wins.find((w) => w.focused && !w.minimized);
      const activeEl = document.querySelector("#active-app");
      if (activeEl) activeEl.textContent = active ? active.title.split(" — ")[0] : "";

      for (let i = 1; i <= 3; i++) {
        const el = document.querySelector(`#ws-count-${i}`);
        if (el) {
          const c = wins.filter((x) => x.workspace === i).length;
          el.textContent = `${c} ${c === 1 ? "janela" : "janelas"}`;
        }
      }
    };

    wm = new WindowManager(desktopEl, { onChange: renderDock });
    import("./js/contextmenu.js").then((cm) => {
      cm.installContextMenu();
      cm.setContextMenu(desktopEl, (e) => {
        if (e.target.closest(".window")) return [];
        const open = (id) => () => appload.openApp(id, desktopEl);
        return [
          { label: "Aplicativos…", action: () => toggleLauncher() },
          { label: "Finder", action: open("finder") },
          { label: "Terminal", action: open("shell") },
          { label: "CMD/EXE", action: open("cmdexe") },
          { label: "Shell InkOS", action: open("vfs-shell") },
          "-",
          { label: "Alternar tema", action: () => document.querySelector("#theme-toggle").click() },
          { label: "Ajustes", action: open("settings") },
        ];
      });
      const toggleFullscreen = () => {
        const d = document, el = d.documentElement;
        if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
        else (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: "hide" });
      };
      const menuBtn = document.querySelector("#inkos-menu");
      menuBtn.addEventListener("click", () => {
        const r = menuBtn.getBoundingClientRect();
        const dark = document.documentElement.dataset.theme !== "latte";
        const keysOpen = document.documentElement.classList.contains("mods-open");
        const wsCard = (n) => wsRail.querySelector(`.ws-card[data-ws="${n}"]`);
        cm.openContextMenu(r.left - 4, r.bottom - 2, [
          { label: "Sobre o InkOS", action: () => appload.openApp("monitor", desktopEl) },
          { label: "Ajustes…", action: () => appload.openApp("settings", desktopEl) },
          "-",
          ...[1, 2, 3].map((n) => ({ label: `${wm.workspace === n ? "✓ " : ""}Workspace ${n}`, action: () => wsCard(n)?.click() })),
          { label: "Mostrar workspaces", action: () => wsRail.classList.toggle("open") },
          "-",
          { label: `${keysOpen ? "✓ " : ""}Teclas (Esc, Tab, Ctrl…)`, action: () => document.querySelector("#keys-toggle").click() },
          { label: dark ? "Tema claro" : "Tema escuro", action: () => document.querySelector("#theme-toggle").click() },
          "-",
          ...(document.fullscreenEnabled || document.webkitFullscreenEnabled
            ? [{ label: document.fullscreenElement || document.webkitFullscreenElement ? "Sair da tela cheia" : "Tela cheia", action: () => toggleFullscreen() }]
            : [{ label: "Tela cheia: Compartilhar → Adicionar à Tela de Início", disabled: true }]),
          { label: "Recarregar InkOS", action: () => location.reload() },
          "-",
          { label: "Voltar ao InkDOS Hub", action: () => location.assign(appload.hubBase()) },
        ]);
      });
      cm.setContextMenu(dockEl, (e) => {
        const item = e.target.closest(".dock-item");
        const winId = item?.dataset.winId;
        if (!winId || !wm.windows.has(winId)) return item ? [{ label: "Abrir", action: () => item.click() }] : [];
        const w = wm.windows.get(winId);
        return [
          { label: w.minimized ? "Mostrar" : "Minimizar", action: () => (w.minimized ? wm.focus(winId) : wm.minimize(winId)) },
          { label: "Fechar", danger: true, action: () => wm.close(winId) },
        ];
      });
    }).catch((e) => console.warn("[InkOS] contextmenu.js:", e));
    import("./js/mobile.js").then((m) => m.initMobileSupport?.()).catch((e) => console.warn("[InkOS] mobile.js:", e));
    appload.bindWindowManager(wm);
    renderDock([]);

    wsRail.querySelectorAll(".ws-card").forEach((card) => {
      card.addEventListener("click", () => {
        const n = Number(card.dataset.ws || 1);
        wm.setWorkspace(n);
        wsRail.querySelectorAll(".ws-card").forEach((c) => c.classList.toggle("active", c === card));
      });
    });

    const lazyNative = (path, exportName, fallbackMsg) => async (el, ctx) => {
      try {
        const mod = await import(path);
        return await mod[exportName](el, {
          ...ctx,
          vfs,
          wm,
          closeApp: (id) => appload.closeApp(id),
          openApp: (id, desk, c) => appload.openApp(id, desk || desktopEl, c),
          syncTheme: appload.syncTheme,
        });
      } catch (e) {
        el.innerHTML = `<div style="padding:16px;font-size:13px;line-height:1.5;">
          <strong>Módulo pendente:</strong> <code>${path}</code><br>
          <span style="color:var(--muted);">${fallbackMsg} (${e.message})</span>
        </div>`;
      }
    };

    appload.registerNativeApp("finder", {
      label: "Finder",
      iconId: "i-finder",
      title: "Finder — Memória Interna InkOS",
      width: 820,
      height: 520,
      mount: lazyNative("./js/apps/finder.js", "mountFinder", "Crie inkos/web/js/apps/finder.js no repositório."),
    });
    appload.registerNativeApp("browser", {
      label: "Browser",
      iconId: "i-browser",
      title: "InkBrowser",
      width: 900,
      height: 600,
      mount: lazyNative("./js/apps/browser.js", "mountBrowser", "Crie inkos/web/js/apps/browser.js no repositório."),
    });
    appload.registerNativeApp("vfs-shell", {
      label: "Shell InkOS",
      iconId: "i-terminal",
      title: "Shell InkOS — VFS e sessões",
      width: 760,
      height: 460,
      mount: lazyNative("./js/apps/shell.js", "mountShell", "Crie inkos/web/js/apps/shell.js no repositório."),
    });
    // Terminal and CMD/EXE: InkOS windows around the engines served by the Hub.
    // InkShell runs Alpine Linux on the InkSoC engine; InkSoC runs cmd.exe or the .exe sent to it.
    appload.registerFrameApp("shell", {
      label: "Terminal",
      iconId: "i-terminal",
      title: "Terminal — Alpine Linux",
      path: "InkShell/?inkos=1",
      width: 780,
      height: 500,
    });
    appload.registerFrameApp("cmdexe", {
      label: "CMD/EXE",
      iconId: "i-cmd",
      title: "CMD — InkSoC",
      path: "InkSoC/?inkos=1",
      width: 820,
      height: 560,
      multi: true,
    });
    appload.registerNativeApp("monitor", {
      label: "Monitor",
      iconId: "i-monitor",
      title: "Monitor de Sistema",
      width: 680,
      height: 500,
      mount: lazyNative("./js/apps/monitor.js", "mountMonitor", "Crie inkos/web/js/apps/monitor.js no repositório."),
    });
    appload.registerNativeApp("settings", {
      label: "Ajustes",
      iconId: "i-settings",
      title: "Configurações & Planos de Fundo",
      width: 740,
      height: 500,
      mount: lazyNative("./js/apps/settings.js", "mountSettings", "Crie inkos/web/js/apps/settings.js no repositório."),
    });

    window.inkOS = { diag: { booting: true }, vfs, openApp: appload.openApp, closeApp: appload.closeApp };
    // ?open=<app id>: open that app on start (the Hub's InkSoC link opens InkOS with ?open=cmdexe)
    {
      const startApp = new URLSearchParams(location.search).get("open");
      if (startApp && /^[a-z0-9-]{1,40}$/.test(startApp)) appload.openApp(startApp, desktopEl).catch((e) => console.warn("[InkOS] ?open:", e.message));
    }
    import("./js/kernel.js")
      .then(({ bootKernel }) => bootKernel({ pkgUrl: "../pkg/inkos.js", workerUrl: "./js/swap.worker.js" }))
      .then((booted) => {
        Object.assign(window.inkOS, booted);
        badge.textContent = booted.diag.profile === "mt" ? "SAB • mt" : "Compat • st";
        badge.title = booted.diag.profileReason || "crossOriginIsolated + shared memory ok";
        window.dispatchEvent(new CustomEvent("inkos:booted", { detail: booted.diag }));
      })
      .catch((e) => console.error("[InkOS] kernel boot failed:", e));

    function toggleLauncher(force) {
      const next = typeof force === "boolean" ? force : !launcherWin.hidden;
      launcherWin.hidden = next;
      if (!launcherWin.hidden) {
        appload.mountLauncher(launcherGrid, desktopEl, { filterText: launcherSearch.value }).catch(console.error);
        launcherSearch.focus();
      }
    }

    launcherSearch.addEventListener("input", () => {
      appload.mountLauncher(launcherGrid, desktopEl, { filterText: launcherSearch.value }).catch(console.error);
    });
    launcherGrid.addEventListener("click", (e) => {
      if (e.target.closest("button")) toggleLauncher(true);
    });

    document.querySelector("#launcher-close").addEventListener("click", () => toggleLauncher(true));

    document.querySelector("#theme-toggle").addEventListener("click", () => {
      const cur = document.documentElement.dataset.theme;
      const next = cur === "latte" ? "mocha" : "latte";
      document.documentElement.dataset.theme = next;
      if (settingsMod?.savePrefs) settingsMod.savePrefs({ theme: next });
      appload.syncTheme();
    });

    import("./js/mode.js").then((m) => m.applyLayoutMode(m.currentMode(), { openLauncher: () => toggleLauncher(false) }));

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("[InkOS] sw register:", e));
    }
  </script>
</body>
</html>
